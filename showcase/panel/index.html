<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>J.A.R.V.I.S</title>
<link rel="stylesheet" href="../onboarding/onboarding.css">
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="raycast.css">
</head>
<body>
<div class="frame shut" id="frame">
<header class="head">
  <!-- J.A.R.V.I.S, reacting to what's going on (decorative; the status line says it). -->
  <canvas class="avatar" id="avatar" aria-hidden="true"></canvas>
  <div class="head-text">
    <div class="who">
      <span class="led" id="led" aria-hidden="true"></span>
      <h1 id="title">J.A.R.V.I.S</h1>
      <span class="ver" id="ver"></span>
      <!-- Quit, at the end of the row: the first press turns it into Confirm for a few seconds. -->
      <button class="link danger arm head-quit" type="button" id="head-quit" aria-pressed="false" aria-label="Quit J.A.R.V.I.S"><span class="no" aria-hidden="true">Quit</span><span class="yes" aria-hidden="true">Confirm</span></button>
    </div>
    <p class="by" id="by">Personal assistant</p>
    <!-- What it's doing and the model, for screen readers; on screen the LED shows it. -->
    <p class="sr-only" id="now" role="status" aria-live="polite"></p>
    <p class="saying" id="saying" aria-hidden="true"></p>
  </div>
</header>

<div class="jump" role="search">
  <span class="jump-ico" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2 14 14"/></svg></span>
  <input id="jump" type="search" placeholder="Search settings and pages" aria-label="Search settings and pages" autocomplete="off" spellcheck="false">
  <kbd>Ctrl K</kbd>
</div>

<div class="split">
  <!-- One page per concern: what's going on, what it remembers, then a page for each group of settings. -->
  <nav class="side" aria-label="Panel">
    <ul class="nav">
      <li><button class="px navi" type="button" id="nav-home" data-page="home" data-search="start chat recent conversation" aria-controls="pane-home" aria-current="page">Home<span class="dot" aria-hidden="true"></span></button></li>
      <li><button class="px navi" type="button" id="nav-memory" data-page="memory" data-search="remember forget conversations history" aria-controls="pane-memory">Memory<span class="dot" aria-hidden="true"></span></button></li>
    </ul>
    <p class="side-label" id="side-settings">Settings</p>
    <ul class="nav" aria-labelledby="side-settings">
      <li><button class="px navi" type="button" id="nav-model" data-page="model" data-search="brain ai key provider groq openai anthropic gemini" aria-controls="pane-model">Model<span class="dot" aria-hidden="true"></span></button></li>
      <li><button class="px navi" type="button" id="nav-appearance" data-page="appearance" data-search="theme look size colour color" aria-controls="pane-appearance">Appearance<span class="dot" aria-hidden="true"></span></button></li>
      <li><button class="px navi" type="button" id="nav-speaking" data-page="speaking" data-search="voice tts elevenlabs fish speech talk audio" aria-controls="pane-speaking">Speaking<span class="dot" aria-hidden="true"></span></button></li>
      <li><button class="px navi" type="button" id="nav-listening" data-page="listening" data-search="mic microphone wake push to talk speech" aria-controls="pane-listening">Listening<span class="dot" aria-hidden="true"></span></button></li>
      <li><button class="px navi" type="button" id="nav-screen" data-page="screen" data-search="display awareness screenshot watch see" aria-controls="pane-screen">Screen<span class="dot" aria-hidden="true"></span></button></li>
      <li><button class="px navi" type="button" id="nav-shortcuts" data-page="shortcuts" data-search="keys hotkey keyboard" aria-controls="pane-shortcuts">Shortcuts<span class="dot" aria-hidden="true"></span></button></li>
      <li><button class="px navi" type="button" id="nav-routines" data-page="routines" data-search="schedule briefing morning tasks todoist" aria-controls="pane-routines">Routines<span class="dot" aria-hidden="true"></span></button></li>
      <li><button class="px navi" type="button" id="nav-general" data-page="general" data-search="startup login updates privacy" aria-controls="pane-general">General<span class="dot" aria-hidden="true"></span></button></li>
      <li><button class="px navi" type="button" id="nav-about" data-page="about" data-search="version update license" aria-controls="pane-about">About<span class="dot" aria-hidden="true"></span></button></li>
    </ul>
  </nav>
  <main class="body">
    <section class="pane" id="pane-home" aria-labelledby="nav-home"></section>
    <section class="pane" id="pane-memory" aria-labelledby="nav-memory" hidden></section>
    <section class="pane" id="pane-model" aria-labelledby="nav-model" hidden></section>
    <section class="pane" id="pane-appearance" aria-labelledby="nav-appearance" hidden></section>
    <section class="pane" id="pane-speaking" aria-labelledby="nav-speaking" hidden></section>
    <section class="pane" id="pane-listening" aria-labelledby="nav-listening" hidden></section>
    <section class="pane" id="pane-screen" aria-labelledby="nav-screen" hidden></section>
    <section class="pane" id="pane-shortcuts" aria-labelledby="nav-shortcuts" hidden></section>
    <section class="pane" id="pane-routines" aria-labelledby="nav-routines" hidden></section>
    <section class="pane" id="pane-general" aria-labelledby="nav-general" hidden></section>
    <section class="pane" id="pane-about" aria-labelledby="nav-about" hidden></section>
  </main>
</div>
<p class="note" id="note" role="status" aria-live="polite" hidden></p>
<!-- Tooltip: what a choice is for and what it costs. The same text is each option's description for screen readers. -->
<div class="px tip" id="tip" aria-hidden="true" hidden></div>

</div>
<script src="../roamies/core.js"></script>
<script src="../roamies/jarvis.js"></script>
<script src="../roamies/10-dither.js"></script>
<script src="panel.js"></script>
</body>
</html>
