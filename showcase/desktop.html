<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>J.A.R.V.I.S on the desktop</title>
<style>
  /* Bubble and research-card text (the setup guide's body font). */
  @font-face { font-family: "Inter"; src: url("onboarding/fonts/InterVariable.ttf") format("truetype"); font-weight: 100 900; font-display: swap; }
  /* Headings on drawn cards and tickets. */
  @font-face { font-family: "Doto"; src: url("onboarding/fonts/doto.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  /* Sized and moved by core.js to cover just what's drawn. */
  canvas { position: fixed; left: 0; top: 0; display: block; cursor: grab; touch-action: none; transform-origin: 0 0; will-change: transform;
    /* Never selectable: a stray triple-click or Select All tints a selected canvas solid grey over its whole box. */
    -webkit-user-select: none; user-select: none; }
  canvas:active { cursor: grabbing; }
  /* Always-Aware: the small dot, always on while it's on. */
  #aware { position: fixed; top: 10px; right: 12px; z-index: 40; display: flex; align-items: center; gap: 7px;
    padding: 4px 11px; background: rgba(8, 11, 16, 0.74); border: 1px solid rgba(56, 184, 255, 0.4); border-radius: 999px;
    font: 600 11px "Inter", system-ui, sans-serif; color: #9bdcff; letter-spacing: 0.03em; pointer-events: none;
    opacity: 0; transition: opacity .18s ease; }
  #aware.on { opacity: 1; }
  #aware .dot { width: 7px; height: 7px; border-radius: 50%; background: #38b8ff; box-shadow: 0 0 7px rgba(56, 184, 255, 0.85); }
  #aware[data-state="private"] { color: #8b93a3; border-color: #313a4a; }
  #aware[data-state="private"] .dot { background: #5a6474; box-shadow: none; }
</style>
</head>
<body>
<canvas id="stage" aria-label="J.A.R.V.I.S on the desktop"></canvas>
<div id="aware" data-state="watching" aria-hidden="true"><span class="dot"></span><span class="aware-label">Watching</span></div>
<script src="roamies/core.js"></script>
<script src="roamies/markdown.js"></script>
<script src="roamies/voice-out.js"></script>
<script src="roamies/sfx.js"></script>
<script src="roamies/glass.js"></script>
<script src="roamies/minis.js"></script>
<script src="roamies/agent-home.js"></script>
<script src="roamies/agent.js"></script>
<script src="roamies/agent-tools.js"></script>
<script src="roamies/agent-cards.js"></script>
<script src="roamies/agent-panel.js"></script>
<script src="roamies/jarvis.js"></script>
<script src="roamies/10-dither.js"></script>
<script src="roamies/12-sidekick.js"></script>
<script>Roamie.bootDesktop(document.getElementById("stage")); document.fonts.load('500 13px "Inter"');</script>
<script src="roamies/ink3d.js"></script>
<script src="roamies/world.js"></script>
<script src="roamies/ink.js"></script>
<script src="roamies/sidebar.js"></script>
<script src="roamies/pen.js"></script>
<script>document.fonts.load('800 16px "Doto"');</script>
<script src="roamies/ask-bar.js"></script>
<script src="roamies/host.js"></script>
</body>
</html>
